name: Build Kernel

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            libfdt-dev python3 rsync cpio lz4 kmod patch device-tree-compiler dwarves \
            git curl zip unzip zstd xz-utils ccache

      - name: Install Samsung clang-r510928
        run: |
          mkdir -p toolchain_samsung_sm8750/kernel_platform/prebuilts
          curl -fL --retry 3 -o toolchain.tar.zst \
            https://github.com/yucca-a/sm8750-toolchain/releases/download/clang-r510928/sm8750-toolchain-clang-r510928.tar.zst
          tar --zstd -xf toolchain.tar.zst -C toolchain_samsung_sm8750/kernel_platform/prebuilts

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: fei-ke/AnyKernel3
          ref: s25
          path: AnyKernel3_s25

      - name: Check and Build
        working-directory: source
        run: |
          ./build.sh lkm --pack --jobs 2 --check
          ./build.sh lkm --pack --jobs 2

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM8750-lkm
          if-no-files-found: error
          path: |
            source/out/lkm/arch/arm64/boot/Image
            source/out/lkm/SM8750_*.zip
